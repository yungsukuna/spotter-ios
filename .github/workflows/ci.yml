name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install tools
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve iOS Simulator
        id: sim
        run: |
          UDID="$(python3 Scripts/select-simulator.py)"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Spotter.xcodeproj \
            -scheme Spotter \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Spotter.xcodeproj \
            -scheme Spotter \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify
