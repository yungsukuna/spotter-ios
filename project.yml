# XcodeGen spec. Regenerate the project with:  xcodegen generate
#
# The .xcodeproj is NOT committed — it is derived from this file. Source paths
# below are directory globs, so adding a new Swift file requires no change here:
# just create the file and regenerate.

name: Spotter

options:
  bundleIdPrefix: com.yungsukuna
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  Spotter:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    sources:
      - path: Spotter
      # Code compiled into both the app and the widget extension.
      - path: Shared
    dependencies:
      # Embeds the widget / Live Activity extension in the app.
      - target: SpotterWidgets
    entitlements:
      path: Spotter/Spotter.entitlements
      properties:
        # Lets the Home Screen widget read the daily snapshot the app writes.
        com.apple.security.application-groups:
          - group.com.yungsukuna.spotter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yungsukuna.spotter
        PRODUCT_NAME: Spotter
        SWIFT_UPCOMING_FEATURE_STRICT_CONCURRENCY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Spotter/Info.plist
      properties:
        CFBundleDisplayName: Spotter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Automatic
        ITSAppUsesNonExemptEncryption: false
        # Rest-timer Live Activity on the Lock Screen and Dynamic Island.
        NSSupportsLiveActivities: true
        # Shown in the iOS camera permission prompt when the barcode scanner opens.
        NSCameraUsageDescription: Spotter uses the camera to scan barcodes on food packaging so it can look up nutrition information.
        # Injected from Config/App.xcconfig, which optionally includes the
        # gitignored Secrets.xcconfig. Empty when no key is configured.
        USDAAPIKey: $(USDA_API_KEY)

  # Home Screen widget and the rest-timer Live Activity. The one deliberate
  # project.yml change from docs/PHASE2-PLAN.md, Feature 8.
  SpotterWidgets:
    type: app-extension
    platform: iOS
    configFiles:
      # So DEVELOPMENT_TEAM from Secrets.xcconfig reaches the extension too.
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    sources:
      - path: SpotterWidgets
      - path: Shared
      # Pure-Foundation / SwiftUI files reused as-is. Nothing that touches
      # SwiftData or UIApplication may be listed here.
      - path: Spotter/Core/Design/Theme.swift
      - path: Spotter/Core/Utils/UnitConverter.swift
      - path: Spotter/Core/Utils/DayKey.swift
      - path: Spotter/Core/Models/Enums.swift
    entitlements:
      path: SpotterWidgets/SpotterWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yungsukuna.spotter
    info:
      path: SpotterWidgets/Info.plist
      properties:
        CFBundleDisplayName: Spotter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yungsukuna.spotter.widgets
        PRODUCT_NAME: SpotterWidgets
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_UPCOMING_FEATURE_STRICT_CONCURRENCY: YES
        SKIP_INSTALL: YES

  SpotterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SpotterTests
    dependencies:
      - target: Spotter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yungsukuna.spotter.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Spotter:
    build:
      targets:
        Spotter: all
        SpotterTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - SpotterTests
    archive:
      config: Release
